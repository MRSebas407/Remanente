# ──────────────────────────────────────────────
# dnsmasq.conf — DNS local para www.remanente.com
# Escucha en el puerto 53 y resuelve el dominio
# a la IP de Tailscale del servidor.
# ──────────────────────────────────────────────

# Escuchar en todas las interfaces
interface=*
bind-interfaces

# No reenviar consultas de dominios locales
domain-needed
bogus-priv

# Resolver remanente.com a la IP del servidor
address=/remanente.com/SERVER_TAILSCALE_IP

# Upstream DNS (Cloudflare)
server=1.1.1.1
server=1.0.0.1

# Cache
cache-size=1000
